<style>

  :root{

    --ink:#151513; --muted:#5E5A50; --accent:#2F4A3E; --moss:#778E69; --edge:rgba(47,74,62,.28);

  body{font:17px/1.5 "Instrument Sans","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .screen{max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:max(22px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;justify-content:space-between;gap:14px}
  .badge{display:flex;align-items:center;gap:12px}
  .badge svg{height:62px;width:auto;display:block}
  .mark{font-family:"Instrument Serif",Georgia,serif;font-size:2.5rem;line-height:1;color:var(--accent)}
  h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(2rem,9.4vw,2.7rem);line-height:1.05;letter-spacing:-.01em;margin:0}
  h1 em{font-style:italic;color:var(--accent)}
  .count{margin:12px 0 0;font-family:"JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.1em;font-size:.78rem;color:var(--muted)}
  .count b{color:var(--accent);font-weight:500;font-size:1rem}
  .count[hidden]{display:block;visibility:hidden}   /* keeps its space; shown only once it can actually count */
  .scan{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 14px 16px;text-align:center}
  .qr{display:block;width:min(100%,44vh);height:auto;margin:0 auto;border-radius:8px}
  .cap{margin:10px 0 0;font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:1.45rem;line-height:1.2;color:var(--accent)}
  .url{margin:4px 0 0;font-family:"JetBrains Mono",monospace;font-size:.72rem;letter-spacing:.05em;color:var(--muted)}

      <p class="cap">Scan: get 3 makers a month</p>

<script src="tree.js"></script>
<script>
document.getElementById("badge").innerHTML = treeSVG({ ring: true });

// These three are copied from index.html, so the count here is the count the site shows.
const slug = n => n.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
function parseCSV(t){   // RFC 4180: quoted fields, "" escapes, commas and newlines inside quotes
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch !== '"') cell += ch; else if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && t[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
async function getText(url){
  const r = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Math.floor(Date.now() / 60000));   // per-minute, skips stale caches
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.text();
}

// The hand-written makers are read out of index.html's MAKERS array itself, so this can't fall behind it.
// null = couldn't find the array (couldn't look), which is not the same as an empty one.
function handNames(html){
  const block = /const MAKERS = \[([\s\S]*?)\n\];/.exec(html);
  return block ? [...block[1].matchAll(/^\s*name:\s*"([^"]*)"/gm)].map(m => m[1]) : null;
}
// Same rule as index.html's useCSV + rowToMaker + mergeUpdates: hand-written makers all count; a sheet row counts
// if it has a name and a YYYY-MM month, once per name slug, and not if that name is already hand-written.
function countMakers(csv, hand){
  const [head, ...rows] = parseCSV(csv);
  if (!hand || !head || !head.includes("name")) return null;
  const col = k => head.findIndex(h => h.trim() === k), ni = col("name"), ai = col("added");
  const have = new Set(hand.map(slug)), fromSheet = new Set();
  rows.forEach(r => {
    const s = slug((r[ni] || "").trim());
    if (s && /^\d{4}-\d{2}$/.test(r[ai] || "") && !have.has(s)) fromSheet.add(s);
  });
  return hand.length + fromSheet.size;
}
function showCount(n){
  const ok = Number.isInteger(n);
  document.getElementById("count").hidden = !ok;
  if (ok) { document.getElementById("count-n").textContent = n; document.getElementById("count-word").textContent = n === 1 ? "maker" : "makers"; }
}
// Live sheet first: GitHub runs the job that refreshes makers.csv hours late, so the copy can be behind.
// The copy is the fallback for networks that block Google.
const LIVE_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTwb7Wf12fr-E6qRenxRWlSzNV-uHJ_LqZqswm7ddgkBSMfcE73vEwbAD6YSn1uhqzozYyOO_0ZJPoo/pub?gid=1921931271&single=true&output=csv";
const counted = getText("./")
  .then(async html => {
    const hand = handNames(html);
    let n = null;
    try { n = countMakers(await getText(LIVE_CSV), hand); } catch (e) { console.warn("banyan card: live sheet unreachable, using the copy:", e); }
    if (!Number.isInteger(n)) n = countMakers(await getText("makers.csv"), hand);
    showCount(n);
  })
  .catch(e => { console.warn("banyan card: couldn't count:", e); showCount(null); });

// self-check: card.html?check  (result in the tab title)
if (location.search.includes("check")) {
  (async () => {
    await counted;
    const shownAfterLoad = !document.getElementById("count").hidden;
    const csv = 'added,name,age,city,crafts,blurb,links,contact\n' +
      '2026-09,Asha Rao,15,Pune,"Code, Design","Makes games, and\n2026-09,Not A Row,1,x,x,x,x,x",https://a.co,\n' +   // quoted comma + newline
      '2026-10,asha  rao,,,Video,"new work, same person",https://b.co,\n' +   // same person again
      '2026-09,Gokul Sai,16,Hyderabad,Code,already hand-written,,\n' +
      'someday,No Month,,,,,,\n' +
      '2026-09,,,,,,,\n';
    const [index, tree] = await Promise.all([getText("./"), getText("tree.js")]);
    const norm = s => s.replace(/\r\n/g, "\n").trim();
    const copied = norm(tree.split("// ---- copied from index.html ----")[1] || "");
    showCount(null); const hidesOnFail = document.getElementById("count").hidden;
    await counted.then(() => getText("makers.csv")).then(t => showCount(countMakers(t, handNames(index))));
    const results = [
      ["count: quoted commas and newlines, repeats, hand-written and bad rows", countMakers(csv, ["Gokul Sai"]) === 2],
      ["count: no hand-written list or a strange file gives no number", countMakers(csv, null) === null && countMakers("<html>oops</html>", ["Gokul Sai"]) === null],
      ["a failed read shows no number", hidesOnFail],
      ["hand-written makers read from index.html", (handNames(index) || []).includes("Gokul Sai")],
      ["live count shown", shownAfterLoad && /^\d+$/.test(document.getElementById("count-n").textContent)],
      ["tree.js still matches index.html", copied.length > 1000 && norm(index).includes(copied)],
      ["badge drawn", !!document.querySelector("#badge svg circle")],
      ["qr embedded", !!document.querySelector("svg.qr path")],
      ["fits one screen, no scrolling", document.documentElement.scrollHeight <= innerHeight && document.documentElement.scrollWidth <= innerWidth]
    ];
    const fails = results.filter(r => !r[1]).map(r => r[0]);
    document.title = fails.length ? "FAIL " + fails.join(", ") : "OK";
    console.log("card self-check:", results, innerWidth + "x" + innerHeight);
  })();
}
</script>
